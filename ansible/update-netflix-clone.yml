---
- name: Update Netflix Clone Docker Container
  hosts: netflix
  gather_facts: no
  vars:
    docker_compose_path: "/root/netflix-clone"
    docker_registry: "salkin263"
    image_name: "netflix-clone"
    docker_pull_retries: 5
    docker_pull_delay: 15
  
  tasks:
    - name: Read version from local package.json
      delegate_to: localhost
      slurp:
        src: "{{ playbook_dir }}/../package.json"
      register: package_file

    - name: Set version variable
      set_fact:
        app_version: "{{ (package_file.content | b64decode | from_json).version }}"

    - name: Display version to update
      debug:
        msg: "Updating to version {{ app_version }}"

    - name: Ensure docker-compose directory exists
      file:
        path: "{{ docker_compose_path }}"
        state: directory
        mode: '0755'

    - name: Ensure non-root runtime directories are writable
      file:
        path: "{{ item }}"
        state: directory
        owner: '10001'
        group: '10001'
        mode: '0750'
      loop:
        - /movies
        - /series
        - /var/lib/netflix-backup-status
        - /var/lib/netflix-logs

    - name: Ensure deployment backup and diagnostics directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - /root/netflix-database-backups
        - /root/netflix-deploy-failures

    - name: Install read-only LXC system monitoring
      include_tasks: tasks/system-monitor.yml

    - name: Check for an existing compose definition
      stat:
        path: "{{ docker_compose_path }}/docker-compose.yml"
      register: previous_compose

    - name: Preserve the previous compose definition for rollback
      copy:
        src: "{{ docker_compose_path }}/docker-compose.yml"
        dest: "{{ docker_compose_path }}/docker-compose.previous.yml"
        remote_src: true
        mode: '0600'
      when: previous_compose.stat.exists

    - name: Record the previously running image
      command:
        argv:
          - docker
          - inspect
          - --format={{ '{{' }}.Config.Image{{ '}}' }}
          - netflix-clone
      register: previous_container_image
      changed_when: false
      failed_when: false

    - name: Copy docker-compose.yml to remote host
      template:
        src: docker-compose.yml.j2
        dest: "{{ docker_compose_path }}/docker-compose.yml"
        mode: '0644'
      register: compose_file

    - name: Wait for Docker registry DNS
      shell: |
        getent ahosts registry-1.docker.io >/dev/null
        getent ahosts production.cloudfront.docker.com >/dev/null
      args:
        executable: /bin/bash
      register: docker_registry_dns
      changed_when: false
      retries: "{{ docker_pull_retries }}"
      delay: "{{ docker_pull_delay }}"
      until: docker_registry_dns.rc == 0

    - name: Pull new Docker image
      community.docker.docker_image:
        name: "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
        source: pull
        force_source: yes
      register: docker_image_pull
      retries: "{{ docker_pull_retries }}"
      delay: "{{ docker_pull_delay }}"
      until: docker_image_pull is succeeded

    - name: Verify new Docker image
      command:
        argv:
          - docker
          - image
          - inspect
          - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
      changed_when: false

    - name: Deploy, migrate, and verify with automatic rollback
      block:
        - name: Back up the PostgreSQL database before migration
          shell: >-
            docker run --rm --env-file /root/netflix-secrets/app.env postgres:16-alpine
            sh -c 'pg_dump -Fc "$POSTGRESQL_URL"'
            > /root/netflix-database-backups/pre-{{ app_version }}.dump
          args:
            executable: /bin/bash
          no_log: true

        - name: Verify the pre-migration database backup
          shell: >-
            test -s /root/netflix-database-backups/pre-{{ app_version }}.dump &&
            docker run --rm -v /root/netflix-database-backups:/backups:ro postgres:16-alpine
            pg_restore --list /backups/pre-{{ app_version }}.dump >/dev/null
          args:
            executable: /bin/bash
          changed_when: false

        - name: Apply versioned Prisma migrations
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - ./node_modules/.bin/prisma
              - migrate
              - deploy

        - name: Verify the deployed Prisma migration state
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - ./node_modules/.bin/prisma
              - migrate
              - status
          changed_when: false

        - name: Stop and remove the existing container
          community.docker.docker_compose:
            project_src: "{{ docker_compose_path }}"
            state: absent

        - name: Start container with new version
          community.docker.docker_compose:
            project_src: "{{ docker_compose_path }}"
            state: present
            pull: no

        - name: Wait for healthy application version
          uri:
            url: http://127.0.0.1:3000/api/health
            method: GET
            return_content: yes
            status_code: 200
          register: health_response
          changed_when: false
          retries: 18
          delay: 5
          until: >
            (health_response.status | default(0)) == 200 and
            (health_response.json | default({})).get('status') == 'ok' and
            (health_response.json | default({})).get('version') == app_version

        - name: Refresh deployed system metrics
          systemd:
            name: netflix-monitor.service
            state: started

        - name: Read deployed system metrics
          slurp:
            src: /var/lib/netflix-monitor/status.json
          register: deployed_system_metrics_file

        - name: Set deployed system metrics
          set_fact:
            deployed_system_metrics: "{{ deployed_system_metrics_file.content | b64decode | from_json }}"

        - name: Verify deployed container in system metrics
          assert:
            that:
              - deployed_system_metrics.docker.container is not none
              - deployed_system_metrics.docker.container.status == 'running'
              - deployed_system_metrics.docker.container.image == docker_registry ~ '/' ~ image_name ~ ':' ~ app_version
            fail_msg: "System monitoring did not detect the newly deployed container."
      rescue:
        - name: Preserve failed-container diagnostics
          shell: >-
            docker inspect netflix-clone > /root/netflix-deploy-failures/{{ app_version }}-inspect.json 2>&1 || true;
            docker logs netflix-clone > /root/netflix-deploy-failures/{{ app_version }}-container.log 2>&1 || true
          args:
            executable: /bin/bash
          changed_when: true

        - name: Stop the failed deployment
          shell: docker compose down || docker-compose down || true
          args:
            chdir: "{{ docker_compose_path }}"
            executable: /bin/bash

        - name: Restore the previous compose definition
          copy:
            src: "{{ docker_compose_path }}/docker-compose.previous.yml"
            dest: "{{ docker_compose_path }}/docker-compose.yml"
            remote_src: true
            mode: '0644'
          when: previous_compose.stat.exists

        - name: Restart the previous working image
          shell: docker compose up -d --no-build || docker-compose up -d --no-build
          args:
            chdir: "{{ docker_compose_path }}"
            executable: /bin/bash
          when: previous_compose.stat.exists and previous_container_image.rc == 0

        - name: Verify rollback health
          uri:
            url: http://127.0.0.1:3000/api/health
            method: GET
            status_code: 200
          register: rollback_health
          retries: 18
          delay: 5
          until: (rollback_health.status | default(0)) == 200
          when: previous_compose.stat.exists and previous_container_image.rc == 0

        - name: Stop deployment after rollback
          fail:
            msg: >-
              Deployment of {{ app_version }} failed. Previous image
              {{ previous_container_image.stdout | default('unknown') }} was restored;
              diagnostics are in /root/netflix-deploy-failures.

    - name: Remove dangling Docker layers after successful start
      command: docker image prune --force
      changed_when: false

    - name: Display completion message
      debug:
        msg: "Netflix Clone version {{ app_version }} is deployed, healthy, and visible in system monitoring"
