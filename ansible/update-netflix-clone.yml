---
- name: Update Netflix Clone Docker Container
  hosts: netflix
  gather_facts: no
  vars:
    docker_compose_path: "/root/netflix-clone"
    docker_registry: "salkin263"
    image_name: "netflix-clone"
    postgres_backup_image: "postgres:18-alpine"
    postgres_backup_schedule: "*-*-* 03:15:00"
    postgres_backup_timezone: "Europe/Berlin"
    postgres_backup_randomized_delay_seconds: 300
    postgres_backup_lock_wait_seconds: 30
    postgres_backup_timeout_seconds: 900
    postgres_backup_service_timeout_seconds: 1500
    postgres_backup_minimum_copies: 3
    postgres_backup_retention_daily_days: 7
    postgres_backup_retention_weekly_weeks: 4
    postgres_backup_retention_monthly_months: 6
    caddy_image: "caddy:2.10.2-alpine"
    canonical_url: "https://{{ https_hostname }}"
    caddy_root_certificate_path: "{{ docker_compose_path }}/caddy-local-root.crt"
    public_ca_root: /var/lib/netflix-public-certificates
    public_ca_publisher_path: /usr/local/lib/netflix-deploy/publish-public-ca.sh
    allow_public_ca_rotation: false
    retire_previous_public_ca: false
    public_ca_overlap_days: 30
    staging_media_image: "jrottenberg/ffmpeg:7.1-alpine@sha256:8ec1ee1f6a0fcd37c97725827b6b7832795c9596e3439b8da56d7700d61ae778"
    container_cpu_limit: 2
    docker_pull_retries: 5
    docker_pull_delay: 15
    legacy_pre_integrity_migrations:
      - '20251224195918_actor_entity'
      - '20251224222337_'
      - '20260726120000_admin_management_upgrade'
    failed_legacy_baseline_migration: '20251224222337_'
    environment_marker_path: /etc/netflix-clone/environment
    staging_seed_env_file: /root/netflix-secrets/staging-users.env
    deployment_status_root: /var/lib/netflix-deployment-status
    deployment_status_private_key: /etc/netflix-clone/deployment-status.key
    deployment_status_publisher_path: /usr/local/lib/netflix-deploy/publish-deployment-status.py
    legacy_relational_integrity_diff:
      - '[*] Changed the `MovieView` table'
      - '[+] Added index on columns (userId, profilId, createdAt)'
      - '[+] Added index on columns (movieId, createdAt)'
      - '[+] Added foreign key on columns (userId)'
      - '[+] Added foreign key on columns (profilId)'
      - '[+] Added foreign key on columns (movieId)'
      - '[*] Changed the `MovieWatchTime` table'
      - '[+] Added index on columns (profilId, movieId)'
      - '[+] Added index on columns (movieId)'
      - '[+] Added unique index on columns (userId, profilId, movieId)'
      - '[+] Added foreign key on columns (userId)'
      - '[+] Added foreign key on columns (profilId)'
      - '[+] Added foreign key on columns (movieId)'
      - '[*] Changed the `Playlist` table'
      - '[+] Added index on columns (userId, profilId)'
      - '[+] Added foreign key on columns (userId)'
      - '[+] Added foreign key on columns (profilId)'
      - '[*] Changed the `PlaylistEntry` table'
      - '[+] Added index on columns (playlistId, order)'
      - '[+] Added index on columns (movieId)'
      - '[+] Added unique index on columns (playlistId, movieId)'
      - '[+] Added foreign key on columns (movieId)'
  
  pre_tasks:
    - name: Validate requested deployment environment
      assert:
        that:
          - (deployment_environment | default('')) in ['staging', 'production']
        fail_msg: >-
          Set deployment_environment to either staging or production.

    - name: Validate scheduled PostgreSQL backup policy
      assert:
        that:
          - postgres_backup_schedule is match('^[0-9*,:./-]+ [0-9*,:./-]+$')
          - postgres_backup_timezone is match('^[A-Za-z_]+(?:/[A-Za-z0-9_+.-]+)+$')
          - postgres_backup_randomized_delay_seconds | int >= 0
          - postgres_backup_randomized_delay_seconds | int <= 3600
          - postgres_backup_lock_wait_seconds | int >= 1
          - postgres_backup_timeout_seconds | int >= 60
          - (postgres_backup_service_timeout_seconds | int) > (postgres_backup_timeout_seconds | int)
          - postgres_backup_minimum_copies | int >= 1
          - postgres_backup_retention_daily_days | int >= 1
          - postgres_backup_retention_weekly_weeks | int >= 1
          - postgres_backup_retention_monthly_months | int >= 1
        fail_msg: >-
          Configure a bounded backup schedule, timezone, timeout, lock wait, and
          retention policy before deploying.

    - name: Select the canonical LAN HTTPS hostname
      set_fact:
        https_hostname: >-
          {{ https_hostname | default('netflix-staging' if deployment_environment == 'staging' else 'netflix', true) }}

    - name: Validate canonical LAN HTTPS hostname
      assert:
        that:
          - https_hostname is defined
          - https_hostname | length > 0
          - https_hostname is match('^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$')
          - "'..' not in https_hostname"
        fail_msg: >-
          Set https_hostname to a LAN hostname without protocol, port, or path,
          for example 'netflix' or 'netflix-staging'.

    - name: Validate public CA rotation controls
      assert:
        that:
          - allow_public_ca_rotation | bool in [true, false]
          - retire_previous_public_ca | bool in [true, false]
          - not (retire_previous_public_ca | bool) or (allow_public_ca_rotation | bool)
          - public_ca_overlap_days | int >= 1
          - public_ca_overlap_days | int <= 90
        fail_msg: >-
          Certificate rotation and retirement must be explicit. Set
          allow_public_ca_rotation=true for a changed root and additionally set
          retire_previous_public_ca=true only after the overlap period ends.

    - name: Check immutable LXC environment marker
      stat:
        path: "{{ environment_marker_path }}"
      register: environment_marker

    - name: Require an explicit LXC environment marker
      assert:
        that:
          - environment_marker.stat.exists
          - environment_marker.stat.isreg
        fail_msg: >-
          The target has no {{ environment_marker_path }} marker. Create it manually
          with exactly '{{ deployment_environment }}' before deploying.

    - name: Read immutable LXC environment marker
      slurp:
        src: "{{ environment_marker_path }}"
      register: environment_marker_file

    - name: Prevent deployment to the wrong LXC
      assert:
        that:
          - (environment_marker_file.content | b64decode | trim) == deployment_environment
        fail_msg: >-
          Deployment target mismatch: the selected inventory is for
          '{{ deployment_environment }}', but the LXC marker contains a different environment.

    - name: Read CPUs available to the LXC
      command: nproc
      register: available_lxc_cpus
      changed_when: false

    - name: Require enough CPUs for the container limit
      assert:
        that:
          - available_lxc_cpus.stdout | trim | int >= container_cpu_limit | int
        fail_msg: >-
          The LXC exposes {{ available_lxc_cpus.stdout | trim }} CPU(s), but the
          application reserves {{ container_cpu_limit }}. Increase the LXC CPU
          allocation before deploying.

    - name: Check protected staging user seed file
      stat:
        path: "{{ staging_seed_env_file }}"
      register: staging_seed_file
      when: deployment_environment == 'staging'

    - name: Validate protected staging user seed file
      assert:
        that:
          - staging_seed_file.stat.exists
          - staging_seed_file.stat.isreg
          - staging_seed_file.stat.uid == 0
          - staging_seed_file.stat.mode == '0600'
        fail_msg: >-
          Create {{ staging_seed_env_file }} as a root-owned 0600 file containing
          E2E_USER_EMAIL, E2E_USER_PASSWORD, E2E_ADMIN_EMAIL, and
          E2E_ADMIN_PASSWORD before deploying staging.
      when: deployment_environment == 'staging'

  tasks:
    - name: Read version from local package.json
      delegate_to: localhost
      slurp:
        src: "{{ playbook_dir }}/../package.json"
      register: package_file

    - name: Set version variable
      set_fact:
        app_version: "{{ (package_file.content | b64decode | from_json).version }}"

    - name: Display version to update
      debug:
        msg: "Updating {{ deployment_environment }} to version {{ app_version }}"

    - name: Ensure docker-compose directory exists
      file:
        path: "{{ docker_compose_path }}"
        state: directory
        mode: '0755'

    - name: Ensure backup status root is readable by the app
      file:
        path: /var/lib/netflix-backup-status
        state: directory
        owner: root
        group: '10001'
        mode: '0750'

    - name: Inspect backup status root access boundary
      stat:
        path: /var/lib/netflix-backup-status
      register: backup_status_root
      changed_when: false

    - name: Verify backup status root access boundary
      assert:
        that:
          - backup_status_root.stat.exists
          - backup_status_root.stat.isdir
          - backup_status_root.stat.uid == 0
          - backup_status_root.stat.gid == 10001
          - backup_status_root.stat.mode == '0750'
        fail_msg: >-
          /var/lib/netflix-backup-status must remain root-owned, group-readable
          by application gid 10001, and non-writable to that group.

    - name: Ensure non-root runtime directories are writable
      file:
        path: "{{ item }}"
        state: directory
        owner: '10001'
        group: '10001'
        mode: '0750'
      loop:
        - /movies
        - /series
        - /var/lib/netflix-backup-status/verification
        - /var/lib/netflix-backup-status/scheduled
        - /var/lib/netflix-logs
      tags:
        - runtime_permissions

    - name: Ensure chunk upload directories are writable
      file:
        path: "{{ item }}"
        state: directory
        owner: '10001'
        group: '10001'
        mode: '0750'
        recurse: true
      loop:
        - /movies/temp
        - /series/temp
      tags:
        - runtime_permissions

    - name: Ensure deployment backup and diagnostics directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - /root/netflix-database-backups
        - /root/netflix-deploy-failures

    - name: Ensure deployment helper directory exists
      file:
        path: /usr/local/lib/netflix-deploy
        state: directory
        mode: '0755'

    - name: Ensure deployment status directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ deployment_status_root }}"
        - "{{ deployment_status_root }}/records"
        - "{{ deployment_status_root }}/trusted-keys"

    - name: Ensure public CA directory exists
      file:
        path: "{{ public_ca_root }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install public CA publisher
      copy:
        src: files/publish-public-ca.sh
        dest: "{{ public_ca_publisher_path }}"
        owner: root
        group: root
        mode: '0755'

    - name: Generate the host deployment-status signing key
      command: >-
        openssl genpkey -algorithm ED25519 -out {{ deployment_status_private_key }}
      args:
        creates: "{{ deployment_status_private_key }}"

    - name: Protect the host deployment-status signing key
      file:
        path: "{{ deployment_status_private_key }}"
        owner: root
        group: root
        mode: '0600'

    - name: Export the host deployment-status verification key
      command:
        argv:
          - openssl
          - pkey
          - -in
          - "{{ deployment_status_private_key }}"
          - -pubout
      register: deployment_status_public_key
      changed_when: false

    - name: Publish the verification key as read-only deployment metadata
      copy:
        content: "{{ deployment_status_public_key.stdout }}\n"
        dest: "{{ deployment_status_root }}/trusted-keys/{{ deployment_environment }}.pem"
        owner: root
        group: root
        mode: '0644'

    - name: Install deployment status publisher
      copy:
        src: files/publish_deployment_status.py
        dest: "{{ deployment_status_publisher_path }}"
        owner: root
        group: root
        mode: '0755'

    - name: Install PostgreSQL backup helper
      copy:
        src: files/backup-postgres.sh
        dest: /usr/local/lib/netflix-deploy/backup-postgres.sh
        mode: '0755'

    - name: Install isolated PostgreSQL backup verifier
      copy:
        src: files/verify-postgres-backup.sh
        dest: /usr/local/lib/netflix-deploy/verify-postgres-backup.sh
        mode: '0755'

    - name: Install PostgreSQL backup verification runner
      copy:
        src: files/run-postgres-backup-verification.sh
        dest: /usr/local/lib/netflix-deploy/run-postgres-backup-verification.sh
        mode: '0755'

    - name: Install manual PostgreSQL backup verification service
      template:
        src: templates/netflix-backup-verification.service.j2
        dest: /etc/systemd/system/netflix-backup-verification.service
        mode: '0644'

    - name: Install manual PostgreSQL backup verification path
      template:
        src: templates/netflix-backup-verification.path.j2
        dest: /etc/systemd/system/netflix-backup-verification.path
        mode: '0644'

    - name: Enable manual PostgreSQL backup verification requests
      systemd:
        name: netflix-backup-verification.path
        daemon_reload: true
        enabled: true
        state: started

    - name: Install scheduled PostgreSQL backup runner
      copy:
        src: files/run-postgres-backup.sh
        dest: /usr/local/lib/netflix-deploy/run-postgres-backup.sh
        owner: root
        group: root
        mode: '0750'

    - name: Install safe PostgreSQL backup retention manager
      copy:
        src: files/manage-postgres-backups.py
        dest: /usr/local/lib/netflix-deploy/manage-postgres-backups.py
        owner: root
        group: root
        mode: '0750'

    - name: Install scheduled PostgreSQL backup service
      template:
        src: templates/netflix-postgres-backup.service.j2
        dest: /etc/systemd/system/netflix-postgres-backup.service
        owner: root
        group: root
        mode: '0644'

    - name: Install scheduled PostgreSQL backup timer
      template:
        src: templates/netflix-postgres-backup.timer.j2
        dest: /etc/systemd/system/netflix-postgres-backup.timer
        owner: root
        group: root
        mode: '0644'

    - name: Enable scheduled PostgreSQL backups
      systemd:
        name: netflix-postgres-backup.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Install staging media seed helper
      copy:
        src: files/seed-staging-media.sh
        dest: /usr/local/lib/netflix-deploy/seed-staging-media.sh
        mode: '0755'
      when: deployment_environment == 'staging'

    - name: Install read-only LXC system monitoring
      include_tasks: tasks/system-monitor.yml

    - name: Check for an existing compose definition
      stat:
        path: "{{ docker_compose_path }}/docker-compose.yml"
      register: previous_compose

    - name: Check for an existing reverse-proxy definition
      stat:
        path: "{{ docker_compose_path }}/Caddyfile"
      register: previous_caddyfile

    - name: Preserve the previous compose definition for rollback
      copy:
        src: "{{ docker_compose_path }}/docker-compose.yml"
        dest: "{{ docker_compose_path }}/docker-compose.previous.yml"
        remote_src: true
        mode: '0600'
      when: previous_compose.stat.exists

    - name: Preserve the previous reverse-proxy definition for rollback
      copy:
        src: "{{ docker_compose_path }}/Caddyfile"
        dest: "{{ docker_compose_path }}/Caddyfile.previous"
        remote_src: true
        mode: '0600'
      when: previous_caddyfile.stat.exists

    - name: Record the previously running image
      command:
        argv:
          - docker
          - inspect
          - --format={{ '{{' }}.Config.Image{{ '}}' }}
          - netflix-clone
      register: previous_container_image
      changed_when: false
      failed_when: false

    - name: Copy docker-compose.yml to remote host
      template:
        src: docker-compose.yml.j2
        dest: "{{ docker_compose_path }}/docker-compose.yml"
        mode: '0644'
      register: compose_file

    - name: Copy internal HTTPS reverse-proxy configuration
      template:
        src: Caddyfile.j2
        dest: "{{ docker_compose_path }}/Caddyfile"
        mode: '0644'

    - name: Wait for Docker registry DNS
      shell: |
        getent ahosts registry-1.docker.io >/dev/null
        getent ahosts production.cloudfront.docker.com >/dev/null
      args:
        executable: /bin/bash
      register: docker_registry_dns
      changed_when: false
      retries: "{{ docker_pull_retries }}"
      delay: "{{ docker_pull_delay }}"
      until: docker_registry_dns.rc == 0

    - name: Pull new Docker image
      command:
        argv:
          - docker
          - pull
          - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
      register: docker_image_pull
      changed_when: "'Image is up to date' not in docker_image_pull.stdout"
      retries: "{{ docker_pull_retries }}"
      delay: "{{ docker_pull_delay }}"
      until: docker_image_pull.rc == 0

    - name: Pull pinned internal HTTPS reverse proxy
      command:
        argv:
          - docker
          - pull
          - "{{ caddy_image }}"
      register: caddy_image_pull
      changed_when: "'Image is up to date' not in caddy_image_pull.stdout"
      retries: "{{ docker_pull_retries }}"
      delay: "{{ docker_pull_delay }}"
      until: caddy_image_pull.rc == 0

    - name: Verify new Docker image
      command:
        argv:
          - docker
          - image
          - inspect
          - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
      changed_when: false

    - name: Record verified Docker image identity
      command:
        argv:
          - docker
          - image
          - inspect
          - --format={{ '{{' }}.Id{{ '}}' }}
          - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
      register: deployed_image_identity
      changed_when: false
      failed_when: >-
        deployed_image_identity.rc != 0 or
        (deployed_image_identity.stdout | trim) is not
        regex('^sha256:[a-f0-9]{64}$')

    - name: Pull pinned staging media generator
      command:
        argv:
          - docker
          - pull
          - "{{ staging_media_image }}"
      when: deployment_environment == 'staging'

    - name: Read staging environment declaration from app configuration
      command:
        argv:
          - docker
          - run
          - --rm
          - --env-file
          - /root/netflix-secrets/app.env
          - --entrypoint
          - /bin/sh
          - "{{ postgres_backup_image }}"
          - -ec
          - printf '%s' "${DEPLOYMENT_ENVIRONMENT:-missing}"
      register: staging_environment_declaration
      changed_when: false
      when: deployment_environment == 'staging'

    - name: Validate staging environment declaration
      assert:
        that:
          - staging_environment_declaration.stdout | trim == 'staging'
        fail_msg: >-
          /root/netflix-secrets/app.env must contain exactly
          DEPLOYMENT_ENVIRONMENT=staging without quotes.
      when: deployment_environment == 'staging'

    - name: Read staging database name
      command:
        argv:
          - docker
          - run
          - --rm
          - --env-file
          - /root/netflix-secrets/app.env
          - --entrypoint
          - /bin/sh
          - "{{ postgres_backup_image }}"
          - -ec
          - psql "$POSTGRESQL_URL" -Atqc 'SELECT lower(current_database())'
      register: staging_database_name
      changed_when: false
      when: deployment_environment == 'staging'

    - name: Verify staging uses an isolated staging database
      assert:
        that:
          - >-
            'stage' in (staging_database_name.stdout | trim) or
            'staging' in (staging_database_name.stdout | trim)
        fail_msg: >-
          POSTGRESQL_URL connects to database
          '{{ staging_database_name.stdout | trim | default('unknown', true) }}'.
          The staging database name must contain 'stage' or 'staging'.
      when: deployment_environment == 'staging'

    - name: Read deployment start time
      command: date -u +%Y-%m-%dT%H:%M:%S.000Z
      register: deployment_started_at
      changed_when: false

    - name: Initialize deployment status facts
      set_fact:
        deployment_id: >-
          {{ deployment_environment }}-{{ app_version }}-{{ deployment_started_at.stdout | regex_replace('[^0-9A-Za-z._-]', '') }}
        deployment_migration_result: pending
        deployment_migration_attempted: false
        deployment_application_health: pending
        deployment_https_health: pending
        deployment_monitoring_health: pending
        deployment_backup_reference: ''
        deployment_status_rollback_result: >-
          {{ 'pending' if previous_compose.stat.exists and previous_container_image.rc == 0 else 'not_possible' }}

    - name: Deploy, migrate, and verify with automatic rollback
      block:
        - name: Publish deployment start status
          include_tasks: tasks/publish-deployment-status.yml
          vars:
            deployment_status_result: in_progress

        - name: Back up the PostgreSQL database before migration
          command:
            argv:
              - /usr/bin/flock
              - --wait
              - "{{ postgres_backup_lock_wait_seconds }}"
              - /run/lock/netflix-postgres-backup.lock
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - --env
              - BACKUP_PATH=/backups/pre-{{ app_version }}.dump
              - --volume
              - /root/netflix-database-backups:/backups
              - --volume
              - /usr/local/lib/netflix-deploy/backup-postgres.sh:/usr/local/bin/backup-postgres:ro
              - "{{ postgres_backup_image }}"
              - /usr/local/bin/backup-postgres

        - name: Restore-verify the pre-migration database backup
          command:
            argv:
              - /usr/local/lib/netflix-deploy/run-postgres-backup-verification.sh
              - /root/netflix-database-backups/pre-{{ app_version }}.dump
          environment:
            POSTGRES_BACKUP_IMAGE: "{{ postgres_backup_image }}"

        - name: Record verified deployment backup reference
          set_fact:
            deployment_backup_reference: "pre-{{ app_version }}.dump"

        - name: Check Prisma migration history table
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - --volume
              - /usr/local/lib/netflix-deploy/backup-postgres.sh:/usr/local/bin/postgres-deploy:ro
              - "{{ postgres_backup_image }}"
              - /usr/local/bin/postgres-deploy
              - migration-table-status
          register: prisma_migration_table_status
          changed_when: false
          failed_when: >-
            prisma_migration_table_status.rc != 0 or
            (prisma_migration_table_status.stdout | trim) not in ['missing', 'present']

        - name: Count tables in a database without Prisma migration history
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - --entrypoint
              - /bin/sh
              - "{{ postgres_backup_image }}"
              - -ec
              - >-
                psql "$POSTGRESQL_URL" -Atqc
                "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public'"
          register: public_schema_table_count
          changed_when: false
          failed_when: >-
            public_schema_table_count.rc != 0 or
            (public_schema_table_count.stdout | trim) is not regex('^[0-9]+$')
          when: prisma_migration_table_status.stdout | trim == 'missing'

        - name: Initialize an empty staging database schema
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - ./node_modules/.bin/prisma
              - db
              - push
              - --skip-generate
          when:
            - deployment_environment == 'staging'
            - prisma_migration_table_status.stdout | trim == 'missing'
            - public_schema_table_count.stdout | trim | int == 0

        - name: Check known failed legacy baseline migration
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - --volume
              - /usr/local/lib/netflix-deploy/backup-postgres.sh:/usr/local/bin/postgres-deploy:ro
              - "{{ postgres_backup_image }}"
              - /usr/local/bin/postgres-deploy
              - failed-migration-status
              - "{{ failed_legacy_baseline_migration }}"
          register: failed_legacy_migration_status
          changed_when: false
          failed_when: >-
            failed_legacy_migration_status.rc != 0 or
            (failed_legacy_migration_status.stdout | trim) not in
            ['clear', 'failed-schema-present', 'failed-schema-missing']
          when: prisma_migration_table_status.stdout | trim == 'present'

        - name: Recover failed legacy baseline migration as rolled back
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - ./node_modules/.bin/prisma
              - migrate
              - resolve
              - --rolled-back
              - "{{ failed_legacy_baseline_migration }}"
          when:
            - prisma_migration_table_status.stdout | trim == 'present'
            - failed_legacy_migration_status.stdout | trim in ['failed-schema-present', 'failed-schema-missing']

        - name: Record recovered legacy migration as applied
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - ./node_modules/.bin/prisma
              - migrate
              - resolve
              - --applied
              - "{{ failed_legacy_baseline_migration }}"
          when:
            - prisma_migration_table_status.stdout | trim == 'present'
            - failed_legacy_migration_status.stdout | trim == 'failed-schema-present'

        - name: Verify legacy database schema before baselining
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - ./node_modules/.bin/prisma
              - migrate
              - diff
              - --from-schema-datasource
              - prisma/schema.prisma
              - --to-schema-datamodel
              - prisma/schema.prisma
              - --exit-code
          register: legacy_schema_diff
          changed_when: false
          failed_when: legacy_schema_diff.rc not in [0, 2]
          when: prisma_migration_table_status.stdout | trim == 'missing'

        - name: Validate recognized legacy schema state
          assert:
            that:
              - >-
                legacy_schema_diff.rc == 0 or
                (legacy_schema_diff.stdout_lines | map('trim') |
                reject('equalto', '') | list) == legacy_relational_integrity_diff
            fail_msg: >-
              The legacy database differs from both supported baseline states.
              No migration history was changed.
          when: prisma_migration_table_status.stdout | trim == 'missing'

        - name: Discover versioned migrations for legacy baseline
          command:
            argv:
              - docker
              - run
              - --rm
              - --entrypoint
              - find
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - prisma/migrations
              - -mindepth
              - '2'
              - -maxdepth
              - '2'
              - -type
              - f
              - -name
              - migration.sql
              - -printf
              - '%h\n'
          register: legacy_migration_directories
          changed_when: false
          when: prisma_migration_table_status.stdout | trim == 'missing'

        - name: Verify legacy baseline contains migrations
          assert:
            that:
              - legacy_migration_directories.stdout_lines | length > 0
            fail_msg: "No versioned Prisma migrations were found for the legacy baseline."
          when: prisma_migration_table_status.stdout | trim == 'missing'

        - name: Record existing migrations as baseline
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - ./node_modules/.bin/prisma
              - migrate
              - resolve
              - --applied
              - "{{ item | basename }}"
          loop: "{{ legacy_migration_directories.stdout_lines | sort }}"
          loop_control:
            label: "{{ item | basename }}"
          when:
            - prisma_migration_table_status.stdout | trim == 'missing'
            - >-
              legacy_schema_diff.rc == 0 or
              (item | basename) in legacy_pre_integrity_migrations

        - name: Record migration attempt
          set_fact:
            deployment_migration_attempted: true

        - name: Apply versioned Prisma migrations
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - ./node_modules/.bin/prisma
              - migrate
              - deploy

        - name: Verify the deployed Prisma migration state
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - ./node_modules/.bin/prisma
              - migrate
              - status
          changed_when: false

        - name: Record successful migration status
          set_fact:
            deployment_migration_result: succeeded

        - name: Publish post-migration deployment status
          include_tasks: tasks/publish-deployment-status.yml
          vars:
            deployment_status_result: in_progress

        - name: Seed deterministic staging users
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - --env-file
              - "{{ staging_seed_env_file }}"
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - node
              - scripts/seed-staging-users.js
          when: deployment_environment == 'staging'

        - name: Generate and verify staging test media
          command:
            argv:
              - /usr/local/lib/netflix-deploy/seed-staging-media.sh
          environment:
            STAGING_MEDIA_IMAGE: "{{ staging_media_image }}"
          when: deployment_environment == 'staging'

        - name: Seed deterministic staging catalog
          command:
            argv:
              - docker
              - run
              - --rm
              - --env-file
              - /root/netflix-secrets/app.env
              - "{{ docker_registry }}/{{ image_name }}:{{ app_version }}"
              - node
              - scripts/seed-staging-catalog.js
          when: deployment_environment == 'staging'

        - name: Stop and remove the existing container
          command:
            argv:
              - docker
              - compose
              - -f
              - "{{ docker_compose_path }}/docker-compose.yml"
              - down

        - name: Start container with new version
          command:
            argv:
              - docker
              - compose
              - -f
              - "{{ docker_compose_path }}/docker-compose.yml"
              - up
              - -d
              - --no-build
              - --pull
              - never

        - name: Wait for healthy application version
          uri:
            url: http://127.0.0.1:3000/api/health
            method: GET
            return_content: yes
            status_code: 200
          register: health_response
          changed_when: false
          retries: 18
          delay: 5
          until: >
            (health_response.status | default(0)) == 200 and
            (health_response.json | default({})).get('status') == 'ok' and
            (health_response.json | default({})).get('version') == app_version and
            (health_response.json | default({})).get('environment') == deployment_environment

        - name: Record successful application health check
          set_fact:
            deployment_application_health: passed

        - name: Publish application health deployment status
          include_tasks: tasks/publish-deployment-status.yml
          vars:
            deployment_status_result: in_progress

        - name: Wait for the internal HTTPS root certificate
          command:
            argv:
              - docker
              - exec
              - netflix-proxy
              - test
              - -s
              - /data/caddy/pki/authorities/local/root.crt
          register: caddy_root_certificate
          changed_when: false
          retries: 12
          delay: 2
          until: caddy_root_certificate.rc == 0

        - name: Export the internal HTTPS root certificate
          command:
            argv:
              - docker
              - cp
              - netflix-proxy:/data/caddy/pki/authorities/local/root.crt
              - "{{ caddy_root_certificate_path }}"
          changed_when: true

        - name: Validate and publish the public HTTPS root certificate
          command:
            argv:
              - "{{ public_ca_publisher_path }}"
              - "{{ caddy_root_certificate_path }}"
              - "{{ public_ca_root }}"
              - "{{ allow_public_ca_rotation | bool | ternary('true', 'false') }}"
              - "{{ retire_previous_public_ca | bool | ternary('true', 'false') }}"
              - "{{ public_ca_overlap_days }}"
          register: public_ca_publication
          changed_when: "'published' in public_ca_publication.stdout or 'retired' in public_ca_publication.stdout"

        - name: Resolve the canonical LAN hostname locally for deployment checks
          lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.0\.1\s+.*# netflix-clone-https$'
            line: "127.0.0.1 {{ https_hostname }} # netflix-clone-https"
            state: present

        - name: Verify canonical HTTPS health
          uri:
            url: "https://{{ https_hostname }}/api/health"
            method: GET
            return_content: yes
            status_code: 200
            ca_path: "{{ caddy_root_certificate_path }}"
            validate_certs: true
          register: https_health_response
          changed_when: false
          retries: 12
          delay: 3
          until: >
            (https_health_response.status | default(0)) == 200 and
            (https_health_response.json | default({})).get('status') == 'ok' and
            (https_health_response.json | default({})).get('version') == app_version and
            (https_health_response.json | default({})).get('environment') == deployment_environment

        - name: Record successful HTTPS health check
          set_fact:
            deployment_https_health: passed

        - name: Publish HTTPS health deployment status
          include_tasks: tasks/publish-deployment-status.yml
          vars:
            deployment_status_result: in_progress

        - name: Refresh deployed system metrics
          systemd:
            name: netflix-monitor.service
            state: restarted

        - name: Read deployed system metrics
          slurp:
            src: /var/lib/netflix-monitor/status.json
          register: deployed_system_metrics_file

        - name: Set deployed system metrics
          set_fact:
            deployed_system_metrics: "{{ deployed_system_metrics_file.content | b64decode | from_json }}"

        - name: Verify deployed container in system metrics
          assert:
            that:
              - deployed_system_metrics.docker.container is not none
              - deployed_system_metrics.docker.container.status == 'running'
              - >-
                deployed_system_metrics.docker.container.imageId ==
                (deployed_image_identity.stdout | trim | regex_replace('^sha256:', ''))
            fail_msg: >-
              System monitoring did not confirm the newly deployed container image.
              Expected image ID {{ deployed_image_identity.stdout | trim }};
              observed container {{ deployed_system_metrics.docker.container.name | default('missing') }},
              status {{ deployed_system_metrics.docker.container.status | default('missing') }},
              image {{ deployed_system_metrics.docker.container.image | default('missing') }},
              image ID {{ deployed_system_metrics.docker.container.imageId | default('missing') }}.

        - name: Record successful monitoring health check
          set_fact:
            deployment_monitoring_health: passed
            deployment_status_rollback_result: not_required

        - name: Publish successful deployment status
          include_tasks: tasks/publish-deployment-status.yml
          vars:
            deployment_status_result: succeeded
      rescue:
        - name: Mark incomplete migration and health checks as failed
          set_fact:
            deployment_migration_result: >-
              {{ 'succeeded' if deployment_migration_result == 'succeeded' else ('failed' if deployment_migration_attempted else 'pending') }}
            deployment_application_health: >-
              {{ 'passed' if deployment_application_health == 'passed' else 'failed' }}
            deployment_https_health: >-
              {{ 'passed' if deployment_https_health == 'passed' else 'failed' }}
            deployment_monitoring_health: >-
              {{ 'passed' if deployment_monitoring_health == 'passed' else 'failed' }}

        - name: Publish failed deployment status
          include_tasks: tasks/publish-deployment-status.yml
          vars:
            deployment_status_result: failed

        - name: Preserve failed-container diagnostics
          shell: >-
            docker inspect netflix-clone > /root/netflix-deploy-failures/{{ deployment_environment }}-{{ app_version }}-inspect.json 2>&1 || true;
            docker logs netflix-clone > /root/netflix-deploy-failures/{{ deployment_environment }}-{{ app_version }}-container.log 2>&1 || true;
            docker inspect netflix-proxy > /root/netflix-deploy-failures/{{ deployment_environment }}-{{ app_version }}-proxy-inspect.json 2>&1 || true;
            docker logs netflix-proxy > /root/netflix-deploy-failures/{{ deployment_environment }}-{{ app_version }}-proxy.log 2>&1 || true
          args:
            executable: /bin/bash
          changed_when: true

        - name: Stop the failed deployment
          shell: docker compose down || docker-compose down || true
          args:
            chdir: "{{ docker_compose_path }}"
            executable: /bin/bash

        - name: Restore the previous compose definition
          copy:
            src: "{{ docker_compose_path }}/docker-compose.previous.yml"
            dest: "{{ docker_compose_path }}/docker-compose.yml"
            remote_src: true
            mode: '0644'
          when: previous_compose.stat.exists

        - name: Restore the previous reverse-proxy definition
          copy:
            src: "{{ docker_compose_path }}/Caddyfile.previous"
            dest: "{{ docker_compose_path }}/Caddyfile"
            remote_src: true
            mode: '0644'
          when: previous_caddyfile.stat.exists

        - name: Remove the new reverse-proxy definition after a first-deployment failure
          file:
            path: "{{ docker_compose_path }}/Caddyfile"
            state: absent
          when: not previous_caddyfile.stat.exists

        - name: Restart the previous working image
          shell: docker compose up -d --no-build || docker-compose up -d --no-build
          args:
            chdir: "{{ docker_compose_path }}"
            executable: /bin/bash
          when: previous_compose.stat.exists and previous_container_image.rc == 0

        - name: Verify rollback health
          uri:
            url: http://127.0.0.1:3000/api/health
            method: GET
            status_code: 200
          register: rollback_health
          retries: 18
          delay: 5
          until: (rollback_health.status | default(0)) == 200
          when: previous_compose.stat.exists and previous_container_image.rc == 0

        - name: Verify rollback through canonical HTTPS
          uri:
            url: "https://{{ https_hostname }}/api/health"
            method: GET
            status_code: 200
            ca_path: "{{ caddy_root_certificate_path }}"
            validate_certs: true
          register: rollback_https_health
          retries: 18
          delay: 5
          until: (rollback_https_health.status | default(0)) == 200
          when: >-
            previous_compose.stat.exists and
            previous_caddyfile.stat.exists and
            previous_container_image.rc == 0

        - name: Record successful rollback result
          set_fact:
            deployment_status_rollback_result: succeeded
          when: >-
            previous_compose.stat.exists and
            previous_caddyfile.stat.exists and
            previous_container_image.rc == 0

        - name: Publish successful rollback status
          include_tasks: tasks/publish-deployment-status.yml
          vars:
            deployment_status_result: rolled_back
          when: >-
            previous_compose.stat.exists and
            previous_caddyfile.stat.exists and
            previous_container_image.rc == 0

        - name: Stop deployment after rollback
          fail:
            msg: >-
              Deployment of {{ app_version }} failed. Previous image
              {{ previous_container_image.stdout | default('unknown') }} was restored;
              diagnostics are in /root/netflix-deploy-failures.

    - name: Remove dangling Docker layers after successful start
      command: docker image prune --force
      changed_when: false

    - name: Display completion message
      debug:
        msg: >-
          Netflix Clone version {{ app_version }} is deployed to
          {{ deployment_environment }} at {{ canonical_url }}, healthy, and visible
          in system monitoring. Install {{ caddy_root_certificate_path }} on LAN clients.
