sonar.projectKey=netflix
sonar.projectName=netflix

sonar.sources=actions,app,components,data,hooks,lib,prisma,scripts,schemas,ansible,auth.ts,proxy.ts,routes.ts
sonar.exclusions=**/node_modules/**,**/.next/**,**/.scannerwork/**,**/.sonar/**,**/.git/**,**/out/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.*

# Optional: falls du Tests separat matchen willst
sonar.tests=__tests__,actions,app,components,data,hooks,lib,ansible/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,ansible/tests/test_*.py

# Coverage (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions: framework/bootstrap files without testable business logic.
# The Python deployment agent has a dedicated unittest suite, while this project
# publishes JavaScript LCOV only. All excluded files remain in issue analysis.
sonar.coverage.exclusions=**/*.d.ts,**/*.config.*,jest.setup.js,app/**/layout.tsx,app/auth/**/page.tsx,app/api/auth/**,auth.ts,proxy.ts,lib/db.ts,lib/auth.ts,lib/logger.ts,lib/mail.ts,lib/i18n/translations.ts,routes.ts,scripts/**,ansible/**

# Disable specific rules
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.tsx
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S7780
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.tsx
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.ts
