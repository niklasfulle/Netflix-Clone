services:
  app:
    image: salkin263/netflix-clone:${APP_VERSION:-latest}
    container_name: netflix-clone
    env_file:
      - /root/netflix-secrets/app.env
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      DEPLOYMENT_STATUS_APPROVED_PEERS: ${DEPLOYMENT_STATUS_APPROVED_PEERS:-staging}
      AUTH_URL: https://${HTTPS_HOST:-netflix}
      NEXTAUTH_URL: https://${HTTPS_HOST:-netflix}
      AUTH_PUBLIC_URL: https://${HTTPS_HOST:-netflix}
      AUTH_TRUST_HOST: 'true'
      AUTH_TRUSTED_PROXY_HOPS: '1'
      AUTH_WEBAUTHN_RP_ID: ${HTTPS_HOST:-netflix}
      AUTH_WEBAUTHN_ORIGIN: https://${HTTPS_HOST:-netflix}
      PUBLIC_CA_OVERLAP_DAYS: ${PUBLIC_CA_OVERLAP_DAYS:-30}
    ports:
      - "127.0.0.1:3000:3000"
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    cpus: 2.0
    mem_limit: 1g
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /netflix-clone/.next/cache:size=256m,uid=10001,gid=10001
    volumes:
      - /movies:/movies
      - /series:/series
      - /var/lib/netflix-monitor:/monitor:ro
      - /var/lib/netflix-deployment-status:/deployment-status:ro
      - /var/lib/netflix-public-certificates:/public-certificates:ro
      - /var/lib/netflix-backup-status:/backup-status
      - /var/lib/netflix-logs:/netflix-clone/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  proxy:
    image: caddy:2.10.2-alpine
    container_name: netflix-proxy
    environment:
      HTTPS_HOST: ${HTTPS_HOST:-netflix}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 100
    cpus: 0.50
    mem_limit: 256m
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
