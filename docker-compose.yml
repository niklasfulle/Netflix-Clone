services:
  app:
    image: salkin263/netflix-clone:${APP_VERSION:-latest}
    container_name: netflix-clone
    env_file:
      - /root/netflix-secrets/app.env
      - /root/netflix-secrets/redis-app.env
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      DEPLOYMENT_STATUS_APPROVED_PEERS: ${DEPLOYMENT_STATUS_APPROVED_PEERS:-staging}
      AUTH_URL: https://${HTTPS_HOST:-netflix}
      NEXTAUTH_URL: https://${HTTPS_HOST:-netflix}
      AUTH_PUBLIC_URL: https://${HTTPS_HOST:-netflix}
      AUTH_TRUST_HOST: 'true'
      AUTH_TRUSTED_PROXY_HOPS: '1'
      AUTH_WEBAUTHN_RP_ID: ${HTTPS_HOST:-netflix}
      AUTH_WEBAUTHN_ORIGIN: https://${HTTPS_HOST:-netflix}
      PUBLIC_CA_OVERLAP_DAYS: ${PUBLIC_CA_OVERLAP_DAYS:-30}
    depends_on:
      jobs-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - frontend
      - backend
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    cpus: 2.0
    mem_limit: 1g
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /netflix-clone/.next/cache:size=256m,uid=10001,gid=10001
    volumes:
      - /movies:/movies
      - /series:/series
      - /var/lib/netflix-monitor:/monitor:ro
      - /var/lib/netflix-deployment-status:/deployment-status:ro
      - /var/lib/netflix-public-certificates:/public-certificates:ro
      - /var/lib/netflix-backup-status:/backup-status
      - /var/lib/netflix-logs:/netflix-clone/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  jobs-migrate:
    image: salkin263/netflix-clone:${APP_VERSION:-latest}
    container_name: netflix-jobs-migrate
    command: ["node", "scripts/migrate-job-queue.mjs"]
    env_file:
      - /root/netflix-secrets/app.env
    networks:
      - egress
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    cpus: 0.25
    mem_limit: 256m
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      disable: true
    restart: "no"

  jobs-worker:
    image: salkin263/netflix-clone:${APP_VERSION:-latest}
    container_name: netflix-jobs-worker
    command: ["node", ".worker/job-worker.mjs"]
    env_file:
      - /root/netflix-secrets/app.env
      - /root/netflix-secrets/redis-app.env
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
    depends_on:
      jobs-migrate:
        condition: service_completed_successfully
    labels:
      com.netflix-clone.environment: ${DEPLOYMENT_ENVIRONMENT:-production}
      com.netflix-clone.role: jobs-worker
    networks:
      - egress
      - backend
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 150
    cpus: 1.0
    mem_limit: 768m
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - /movies:/movies
      - /series:/series
      - /var/lib/netflix-backup-status:/backup-status
      - /var/lib/netflix-logs:/netflix-clone/logs
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 105s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  redis-runtime:
    image: redis:7.2.15-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
    container_name: netflix-redis-runtime
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    env_file:
      - /root/netflix-secrets/redis-health.env
    labels:
      com.netflix-clone.environment: ${DEPLOYMENT_ENVIRONMENT:-production}
      com.netflix-clone.role: redis-runtime
    networks:
      - backend
    user: "999:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    cpus: 0.50
    mem_limit: 256m
    tmpfs:
      - /data:size=32m,mode=0700,uid=999,gid=1000
      - /tmp:size=16m,mode=1777
    volumes:
      - ./ansible/files/redis-runtime.conf:/usr/local/etc/redis/redis.conf:ro
      - /root/netflix-secrets/redis-users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user health --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  proxy:
    image: caddy:2.10.2-alpine
    container_name: netflix-proxy
    environment:
      HTTPS_HOST: ${HTTPS_HOST:-netflix}
    depends_on:
      - app
    networks:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 100
    cpus: 0.50
    mem_limit: 256m
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true
  egress:

volumes:
  caddy_data:
  caddy_config:
